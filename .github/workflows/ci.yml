name: Continuous Integration
# This workflow runs continuous integration tasks such as linting, building, testing, and uploading coverage reports.

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Yarn 4 has to be active before setup-node, which resolves the Yarn cache folder for caching
      - name: Install Yarn 4.x
        run: corepack enable && corepack prepare yarn@4.4.0 --activate
      - name: Set up Node.js with Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Run e2e tests
        run: yarn test:e2e
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: onmomo/squeeze-plex-hub:ci
          platforms: linux/amd64
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

