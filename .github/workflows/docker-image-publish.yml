name: Git tag and Publish Docker Image

on:
  push:
    branches: ['develop']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          gh auth setup-git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump version and create tag
        run: npx standard-version --release-as minor
      - name: Create and push git tag
        run: git push --follow-tags origin develop
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build & Push the multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: onmomo/squeeze-plex-hub:latest,onmomo/squeeze-plex-hub:${APP_VERSION}
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max