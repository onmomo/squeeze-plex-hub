name: Build and Publish Docker Image
# This workflow builds and publishes the Docker image to Docker Hub when changes are pushed to the 'develop' branch.

on:
  push:
    branches: ['develop']

jobs:        
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag onmomo/squeeze-plex-hub:latest
      - name: Push the Docker image
        run: docker push onmomo/squeeze-plex-hub:latest
