name: Build and Publish Docker Image

on:
  push:
    branches: ['develop']

jobs:        
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to push tags
      - name: Set up Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install Yarn 4.x
        run: corepack enable && corepack prepare yarn@4.4.0 --activate
      - name: Install dependencies
        run: yarn install --immutable      
      - name: Git config
        run: |                    
          gh auth setup-git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}            
      - name: Bump version and create tag
        run: npx standard-version --release-as minor      
      - name: Create and push tag
        run: git push --follow-tags origin develop
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build the Docker image
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          docker build . --file Dockerfile --tag onmomo/squeeze-plex-hub:latest --tag onmomo/squeeze-plex-hub:${VERSION}
      - name: Push the Docker image
        run: |
          docker push onmomo/squeeze-plex-hub:latest
          docker push onmomo/squeeze-plex-hub:${VERSION}
